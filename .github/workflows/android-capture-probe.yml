name: Android Advisor (shared parser + real Buffer)
on:
  push:
    branches:
      - experiment/android-capture-probe-20261008
    paths:
      - 'android-capture-probe/**'
      - '.github/workflows/android-capture-probe.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Check integration invariants
        run: |
          set -euo pipefail
          grep -q 'https://app.moyadvisor.online' android-capture-probe/app/src/main/java/online/moyadvisor/captureprobe/MainActivity.java
          grep -q '/api/android-capture/session' android-capture-probe/app/src/main/java/online/moyadvisor/captureprobe/MainActivity.java
          grep -q 'shared-parser.js' android-capture-probe/app/src/main/java/online/moyadvisor/captureprobe/MainActivity.java
          grep -q 'PendingCaptureStore' android-capture-probe/app/src/main/java/online/moyadvisor/captureprobe/MainActivity.java
          grep -q '/api/wishlist-preview/save' android-capture-probe/app/src/main/java/online/moyadvisor/captureprobe/MainActivity.java
          test ! -e android-capture-probe/app/src/main/assets/probe.js
          test "$(wc -c < android-capture-probe/app/src/main/assets/shared-parser.js)" -gt 100000
          node --check android-capture-probe/app/src/main/assets/shared-parser.js
          node --test android-capture-probe/tests/shell.test.cjs
      - name: Assemble debug APK
        working-directory: android-capture-probe
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK
        working-directory: android-capture-probe
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" | tail -1
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -5
          sha256sum "$APK"
          cp "$APK" ../Advisor-Android-Buffer-beta.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v7
        with:
          path: Advisor-Android-Buffer-beta.apk
          archive: false
          retention-days: 14
